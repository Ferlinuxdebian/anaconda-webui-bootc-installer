# ============================================================================
#  CONFIGURAÇÃO DO ISO — edite APENAS este arquivo
# ============================================================================
#
#  O GitHub Actions gera o ISO automaticamente a cada push na branch main.
#  Para gerar localmente: sudo just iso
#
#  O ISO é publicado como UM ÚNICO arquivo em Actions → Artifacts.
#  Em repositórios públicos, o armazenamento de artefatos é gratuito.
#  A permissão "Read and write" só é necessária no repositório da imagem
#  (para publicar a imagem no GHCR), não neste repositório.
#
#  O padrão abaixo usa a imagem bootc-gnome-minimal-f45, que é assinada com
#  cosign. Se a SUA imagem NÃO for assinada, troque ASSINADA_COM_CONSIG=false.
# ============================================================================

# Nome da imagem no registro do GitHub (GHCR).
# É o nome que aparece em ghcr.io/SEU-USUARIO/<IMAGE_NAME>:tag.
# Use apenas o nome: sem "ghcr.io/", sem o usuário e sem a tag.
# Exemplo: ghcr.io/joao/minha-imagem:latest -> IMAGE_NAME=minha-imagem
# Também vira o nome do arquivo ISO: output/<IMAGE_NAME>.iso
IMAGE_NAME=bootc-gnome-minimal-f45

# Versão do Fedora usada na imagem base do instalador:
#   quay.io/fedora/fedora-bootc:<FEDORA_VERSION>
# O padrão é 45. Para usar Fedora 44, coloque 44.
# Atenção: isto muda o instalador (Anaconda), não a imagem que ele instala.
FEDORA_VERSION=45

# Link completo da imagem bootc que o instalador vai instalar.
# Formato: registro/repositório:tag   (ou registro/repositório@sha256:...)
LINK_DA_IMAGEM_PERSONALIZADA=ghcr.io/ferlinuxdebian/bootc-gnome-minimal-f45:latest

# true  = exige que a imagem seja assinada com cosign.
# false = aceita imagens assinadas e não assinadas.
#
# Se a sua imagem NÃO for assinada, use false.
# true apenas ativa o enforce-container-sigpolicy no bootc install. Não é
# preciso adicionar chave ou política neste repositório.
ASSINADA_COM_CONSIG=true
